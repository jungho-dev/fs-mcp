name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: "Publish package to npm? Choose y or n."
        required: true
        default: "n"
        type: choice
        options:
          - "n"
          - "y"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jungho-dev/fs-mcp' && github.ref == 'refs/heads/public/main'
    uses: ./.github/workflows/publish-prepare.yml

  publish:
    needs: prepare
    if: github.event.inputs.publish_to_npm == 'y'
    uses: ./.github/workflows/publish-release.yml
    with:
      package-name: ${{ needs.prepare.outputs.package_name }}
      package-version: ${{ needs.prepare.outputs.package_version }}
    secrets: inherit

  skipped:
    needs: prepare
    if: github.event.inputs.publish_to_npm != 'y'
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped publish
        run: echo "npm publish skipped. Selected publish_to_npm=${{ github.event.inputs.publish_to_npm }}."
