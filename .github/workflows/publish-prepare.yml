name: Publish Prepare

on:
  workflow_call:
    outputs:
      package_name:
        description: Package name from package.json
        value: ${{ jobs.prepare.outputs.package_name }}
      package_version:
        description: Package version from package.json
        value: ${{ jobs.prepare.outputs.package_version }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      package_version: ${{ steps.metadata.outputs.package_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          remote_url="$(git remote get-url origin)"
          case "$remote_url" in
            "https://github.com/jungho-dev/fs-mcp" | "https://github.com/jungho-dev/fs-mcp.git")
              ;;
            *)
              echo "Unexpected origin remote: $remote_url" >&2
              exit 1
              ;;
          esac

      - name: Resolve package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.name);')"
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version);')"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Prepared $package_name@$package_version."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify package
        run: bun run verify

      - name: Pack package dry run
        run: npm pack --dry-run
