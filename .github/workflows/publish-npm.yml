name: Publish npm Package

on:
  push:
    branches:
      - private/main
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'jungho-dev/fs-mcp-private'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(bun -e \"const pkg = await Bun.file('package.json').json(); console.log(pkg.name);\")" >> "$GITHUB_OUTPUT"
          echo "version=$(bun -e \"const pkg = await Bun.file('package.json').json(); console.log(pkg.version);\")" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: publish_check
        shell: bash
        run: |
          remote_version="$(npm view "${{ steps.package.outputs.name }}" version 2>/dev/null || true)"
          echo "remote_version=$remote_version" >> "$GITHUB_OUTPUT"

          if [ "$remote_version" = "${{ steps.package.outputs.version }}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "npm already has ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}. Skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}."
          fi

      - name: Validate npm token
        if: steps.publish_check.outputs.should_publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: NPM_TOKEN" >&2
            exit 1
          fi

      - name: Publish to npm
        if: steps.publish_check.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Report skipped publish
        if: steps.publish_check.outputs.should_publish != 'true'
        run: echo "No npm publish needed for version ${{ steps.package.outputs.version }}."
