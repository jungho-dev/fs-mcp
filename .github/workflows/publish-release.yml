name: Publish Release

on:
  workflow_call:
    inputs:
      package-version:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: NPM_TOKEN" >&2
            exit 1
          fi
          npm config set registry "https://registry.npmjs.org/" --userconfig "$RUNNER_TEMP/.npmrc"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN" --userconfig "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify package
        run: bun run verify

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing version ${{ inputs.package-version }}."
          npm publish --access public --ignore-scripts
